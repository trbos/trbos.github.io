<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="referrer" content="no-referrer">
    <title>PolyTrack</title>
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, viewport-fit=cover, user-scalable=no"
    >
    <meta
      name="description"
      content="PolyTrack"
    >
    <link rel="preload" href="forced_square.woff2" as="font" type="font/woff2" crossorigin="anonymous">
    <link rel="preload" href="images/pmllogo.svg" as="image" type="image/svg+xml">
    <link rel="preload" href="images/logo.svg" as="image" type="image/svg+xml">
    <link rel="preload" href="images/discord.svg" as="image" type="image/svg+xml">
    <link rel="manifest" href="manifest.json">
    <script>
      (() => {
        const isFramed = () => {
          try {
            return window.top !== window.self;
          } catch {
            return true;
          }
        };

        if (!isFramed()) return;

        const configureFramedLayout = () => {
          const minimumWidth = 1000;
          const minimumHeight = 760;

          document.documentElement.classList.add("is-framed");

          const fitFrame = () => {
            const viewport = window.visualViewport;
            const viewportWidth = Math.max(
              1,
              Math.floor(viewport?.width || document.documentElement.clientWidth || window.innerWidth),
            );
            const viewportHeight = Math.max(
              1,
              Math.floor(viewport?.height || document.documentElement.clientHeight || window.innerHeight),
            );
            const scale = Math.min(1, viewportWidth / minimumWidth, viewportHeight / minimumHeight);
            const layoutWidth = Math.max(minimumWidth, Math.ceil(viewportWidth / scale));
            const layoutHeight = Math.max(minimumHeight, Math.ceil(viewportHeight / scale));

            document.documentElement.style.setProperty("--polytrack-frame-scale", scale.toString());
            document.documentElement.style.setProperty("--polytrack-frame-width", `${layoutWidth}px`);
            document.documentElement.style.setProperty("--polytrack-frame-height", `${layoutHeight}px`);
            document.documentElement.style.setProperty("--polytrack-frame-viewport-width", `${viewportWidth}px`);
            document.documentElement.style.setProperty("--polytrack-frame-viewport-height", `${viewportHeight}px`);
          };

          fitFrame();
          requestAnimationFrame(fitFrame);
          setTimeout(fitFrame, 250);
          window.addEventListener("resize", fitFrame, { passive: true });
          window.addEventListener("orientationchange", fitFrame, { passive: true });
          window.visualViewport?.addEventListener("resize", fitFrame, { passive: true });
          window.visualViewport?.addEventListener("scroll", fitFrame, { passive: true });
        };

        configureFramedLayout();

        let isHandlingEscape = false;
        const fullscreenIconSelector = 'img[src$="images/fullscreen.svg"]';

        const addEscapeListener = () => {
          document.addEventListener("click", escapeFrameFromFullscreenButton, {
            capture: true,
          });
        };

        const removeEscapeListener = () => {
          document.removeEventListener("click", escapeFrameFromFullscreenButton, true);
        };

        const getFullscreenButton = (event) => {
          const path = typeof event.composedPath === "function" ? event.composedPath() : [];

          for (const target of path) {
            if (target instanceof Element) {
              const button = target.closest("button");
              if (button?.querySelector(fullscreenIconSelector)) {
                return button;
              }
            }
          }

          if (event.target instanceof Element) {
            const button = event.target.closest("button");
            if (button?.querySelector(fullscreenIconSelector)) {
              return button;
            }
          }

          return null;
        };

        const blankEmbeddedCopy = () => {
          try {
            window.stop();
          } catch {
          }

          try {
            window.location.replace("about:blank");
          } catch {
            document.documentElement.replaceChildren();
          }
        };

        const openStandaloneTab = (topUrl) => {
          try {
            const openedWindow = window.open(topUrl, "_blank");
            if (!openedWindow) return false;

            try {
              openedWindow.opener = null;
            } catch {
            }

            blankEmbeddedCopy();
            return true;
          } catch {
            return false;
          }
        };

        function escapeFrameFromFullscreenButton(event) {
          if (isHandlingEscape || !isFramed() || !getFullscreenButton(event)) {
            return;
          }

          isHandlingEscape = true;
          removeEscapeListener();

          event.preventDefault();
          event.stopImmediatePropagation();

          if (!openStandaloneTab(window.location.href)) {
            isHandlingEscape = false;
            addEscapeListener();
          }
        }

        addEscapeListener();
      })();
    </script>
    <style>
      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: #28346a;
      }

      #screen,
      #ui,
      #transition-layer {
        position: fixed;
        inset: 0;
      }

      #screen {
        width: 100%;
        height: 100%;
        display: block;
      }

      html.is-framed,
      html.is-framed body {
        position: fixed;
        inset: 0;
        width: 100vw;
        width: var(--polytrack-frame-viewport-width, 100vw);
        height: 100vh;
        height: 100dvh;
        height: var(--polytrack-frame-viewport-height, 100dvh);
        min-width: 0;
        min-height: 0;
        max-width: 100vw;
        max-height: 100vh;
        max-height: 100dvh;
        overflow: hidden;
        overscroll-behavior: none;
        touch-action: none;
      }

      html.is-framed body {
        transform: none;
      }

      html.is-framed #screen,
      html.is-framed #ui,
      html.is-framed #transition-layer {
        position: fixed;
        top: 0;
        left: 0;
        right: auto;
        bottom: auto;
        width: var(--polytrack-frame-width, 100vw);
        height: var(--polytrack-frame-height, 100vh);
        max-width: none;
        max-height: none;
        overflow: hidden;
        transform: scale(var(--polytrack-frame-scale, 1));
        transform-origin: top left;
      }

    </style>
    <script>
      window.polytrackModConfiguration = { unblocked: false };
      const polytrackApiProxyPath = 'https://p01--wordbuilder--675vggg6lnyg.code.run/polytrack/polytrack-api/';
      window.polytrackApiBaseUrl = polytrackApiProxyPath;
      window.polytrackWsBaseUrl = polytrackApiProxyPath.replace(/^http/, 'ws');
      window.polytrackApiAssetUrl = (url) => {
        const asset = new URL(url, window.location.href);
        if (asset.origin !== "https://vps.kodub.com") return url;
        return new URL(
          asset.pathname.replace(/^\/+/, "") + asset.search + asset.hash,
          window.polytrackApiBaseUrl,
        ).href;
      };
    </script>
    <script src="./static-assets.js"></script>
    <script src="./save-merge.js?v=1"></script>
    <script src="./save-bridge.js?v=1"></script>
    <script src="./save-gate.js?v=2"></script>
    <script type="module">
      if (await window.polytrackSaveReady) {
      // Capture the untouched local save before the game initializes defaults.
      try {
        const extra = new Set(['polyMods', 'car_colors', 'MyCar', 'carSound', 'polyprocessing_settings',
          'polyprocessing_settings_v2', 'polyprocessing_windows_state_v1']);
        window.polytrackCloudBackupInitialEntries = [];
        for (let i = 0; i < localStorage.length; i++) {
          const key = localStorage.key(i);
          if (key && (key.startsWith('polytrack_') || extra.has(key))) {
            const value = localStorage.getItem(key);
            if (value !== null) window.polytrackCloudBackupInitialEntries.push([key, value]);
          }
        }
      } catch { window.polytrackCloudBackupInitialEntries = null; }
      const loadScript = src => new Promise((resolve, reject) => {
        const script = document.createElement('script');
        script.src = src;
        script.onload = resolve;
        script.onerror = reject;
        document.head.append(script);
      });
      await loadScript('./error_screen.bundle.js');
      await import('./other-track-ratings.js');
      await loadScript('./main.bundle.js');
      void import('./cloud-backup.js?v=2').catch(() => {});
      }
    </script>
  </head>
  <body>
    <noscript>Error: JavaScript is not supported</noscript>
    <canvas id="screen"></canvas>
    <div id="ui"></div>
    <div id="transition-layer"></div>
  </body>
</html>
