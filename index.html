  <title>trbos</title>
  <link rel="icon" href="assets/icon.svg">
  <link rel="stylesheet" href="assets/site.css?v=copy-3">
  <link rel="stylesheet" href="assets/owner.css?v=2">
  <link rel="stylesheet" href="assets/games.css?v=archers-errors-8">
  <link rel="stylesheet" href="assets/game-requests.css?v=motion-8">
  <script src="assets/owner.js?v=game-starting-3" defer></script>
  <script src="assets/games.js?v=archers-startup-9" defer></script>
  <script src="assets/game-requests.js?v=motion-12" defer></script>

</head>
<body>
  <a class="skip-link" href="#content">Skip to content</a>
  <header class="site-header"><div class="container header-inner">
    <a class="brand" href="#/" aria-label="trbos home">trbos</a>
    <nav aria-label="Main">
      <a href="#/" data-nav="home" aria-current="page">Home</a>
      <a href="#/browser" data-nav="browser" data-browser-link>Browser</a>
      <a href="polytrack/">PolyTrack</a>
      <a href="#/games" data-nav="games">Games</a>
      <a href="#/hx" data-nav="hx">Hx</a>
    </nav>
  </div></header>
  <main id="content" tabindex="-1">
    <div id="title-band" class="title-band" hidden><div class="container"><h1 id="page-title">Hx</h1></div></div>
    <div id="home" class="container home-links">
      <a id="browser-link" class="destination" href="#/browser" data-browser-link>
        <span>Browser</span>
      </a>
      <a class="destination" href="polytrack/">
        <span>PolyTrack</span>
      </a>
      <a class="destination" href="#/games">Games</a>
      <a id="owner-link" class="destination" href="#/owner" hidden>Admin</a>
    </div>
    <section id="owner" class="container site-owner" aria-label="Browser settings" hidden></section>
    <section id="games" class="container games-grid" aria-label="Games" hidden></section>
    <section id="hx" class="container home-links" aria-label="Hx tools" hidden>
      <button class="destination" type="button" data-copy="kahoot" aria-label="Copy Kahoot bookmarklet" aria-live="polite">Kahoot</button>
      <button class="destination" type="button" data-copy="blooket" aria-label="Copy Blooket bookmarklet" aria-live="polite">Blooket</button>
      <button class="destination" type="button" data-copy="gimkit" aria-label="Copy Gimkit bookmarklet" aria-live="polite">Gimkit</button>
    </section>
  </main>
  <section id="player" aria-label="Browser" hidden>
    <div id="frame-host"></div>
    <div id="loading" role="status"><span class="spinner" aria-hidden="true"></span><p>Loading Browser…</p></div>
    <div id="timeout" hidden><p role="status">This is taking longer than expected.</p><button id="retry" type="button">Retry</button></div>
  </section>
  <section id="game-player" aria-label="Game" hidden>
    <div id="game-frame-host"></div>
    <div id="game-loading" role="status">Loading…</div>
    <div id="game-error" hidden><p role="status">Unable to load game.</p><button id="game-retry" type="button">Retry</button></div>
  </section>
</body>
</html>
