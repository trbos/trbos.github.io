        let browserSite = readSite(new URLSearchParams(location.search).get('url'));

        // Only pass absolute web URLs, encoded once through URLSearchParams.
        function readSite(value) {
          if (!value) return null;
          try {
            const url = new URL(value);
            return /^(https?:)$/.test(url.protocol) && url.hostname ? url.href : null;
          } catch {
            return null;
          }
        }

        function route() {
          const hash = location.hash.slice(1);
          const split = hash.indexOf('?');
          return {
            path: (split < 0 ? hash : hash.slice(0, split)).replace(/\/$/, ''),
            query: new URLSearchParams(split < 0 ? '' : hash.slice(split + 1))
          };
        }

        function updateBrowserLink() {
          const query = new URLSearchParams();
          if (browserSite) query.set('url', browserSite);
          const search = query.toString();
          browserLink.setAttribute('href', '#/browser' + (search ? '?' + search : ''));
        }

        function clearPlayer() {
          if (!active) return;
          clearTimeout(active.timer);
          active.frame.remove();
          active = null;
        }

        function finishLoading(state) {
          if (active !== state) return;
          clearTimeout(state.timer);
          loading.hidden = true;
          timeout.hidden = true;
          player.setAttribute('aria-busy', 'false');
        }

        function openPlayer(name) {
          clearPlayer();
          const isBrowser = name === 'browser';
          const url = new URL(isBrowser ? BROWSER_ORIGIN + '/' : POLYTRACK_URL);
          if (isBrowser && browserSite) url.searchParams.set('url', browserSite);
          const frame = document.createElement('iframe');
          const state = { name, frame, timer: null };
          active = state;
          frame.title = isBrowser ? 'Browser' : 'PolyTrack';
          frame.allow = 'autoplay; fullscreen; gamepad; clipboard-read; clipboard-write';
          frame.allowFullscreen = true;
          frame.referrerPolicy = 'strict-origin-when-cross-origin';
          loadingLabel.textContent = isBrowser ? 'Loading Browser…' : 'Loading PolyTrack…';
          loading.hidden = false;
          timeout.hidden = true;
          back.hidden = isBrowser;
          launcher.hidden = true;
          player.hidden = false;
          player.setAttribute('aria-label', frame.title);
          player.setAttribute('aria-busy', 'true');
          document.title = frame.title;

          // Browser confirms UI readiness. PolyTrack only signals document load.
          if (!isBrowser) frame.addEventListener('load', () => finishLoading(state), { once: true });
          state.timer = setTimeout(() => {
            if (active !== state) return;
            loading.hidden = true;
            timeout.hidden = false;
            player.setAttribute('aria-busy', 'false');
          }, LOAD_TIMEOUT_MS);
          frame.src = url.href;
          frameHost.append(frame);
        }

        function render() {
          const current = route();
          if (current.path === '/browser' && current.query.has('url')) {
            browserSite = readSite(current.query.get('url'));
          }
          updateBrowserLink();
          if (current.path === '/browser' || current.path === '/polytrack') {
            openPlayer(current.path.slice(1));
            return;
          }
          const previous = active && active.name;
          clearPlayer();
          player.hidden = true;
          launcher.hidden = false;
          document.title = 'Browser & PolyTrack';
          if (previous) launcher.querySelector(previous === 'browser' ? '#browser-link' : 'a[href="#/polytrack"]').focus({ preventScroll: true });
        }

        window.addEventListener('message', event => {
          if (!active || active.name !== 'browser' || event.source !== active.frame.contentWindow || event.origin !== BROWSER_ORIGIN) return;
          if (event.data && event.data.type === 'browser:ready') finishLoading(active);
          if (event.data && event.data.type === 'browser:launcher') location.hash = '#/';
        });
        window.addEventListener('hashchange', render);
        window.addEventListener('pagehide', clearPlayer);
        window.addEventListener('pageshow', event => { if (event.persisted) render(); });
        retry.addEventListener('click', () => { if (active) openPlayer(active.name); });
        render();
      })();
    </script>
  </body>
</html>
