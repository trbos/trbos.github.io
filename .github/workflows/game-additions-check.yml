name: Game addition checks
on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]
permissions:
  contents: read
concurrency:
  group: game-quality-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  quality:
    name: game-addition-quality
    if: startsWith(github.head_ref, 'add-game/')
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Check whether the game is ready
        id: phase
        env:
          REQUEST_BRANCH: ${{ github.head_ref }}
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          const id = process.env.REQUEST_BRANCH.slice('add-game/'.length);
          assert.match(id, /^[a-f0-9]{8}-[a-f0-9]{4}-4[a-f0-9]{3}-[89ab][a-f0-9]{3}-[a-f0-9]{12}$/);
          const report = JSON.parse(fs.readFileSync('.game-requests/' + id + '.json', 'utf8'));
          assert.equal(report.requestId, id);
          assert.ok(['queued', 'finding', 'testing', 'adding', 'ready', 'unavailable'].includes(report.stage));
          fs.appendFileSync(process.env.GITHUB_OUTPUT, 'ready=' + (report.stage === 'ready') + '\n');
          NODE
      - run: node --test .github/game-tools/quality.test.mjs
      - if: steps.phase.outputs.ready == 'true'
        run: npm ci --prefix .github/game-tools --ignore-scripts
      - if: steps.phase.outputs.ready == 'true'
        run: .github/game-tools/node_modules/.bin/playwright install --with-deps chromium
      - name: Validate source, scope, layout and real runtime
        if: steps.phase.outputs.ready == 'true'
        env:
          REQUEST_BRANCH: ${{ github.head_ref }}
          REQUEST_BASE: ${{ github.event.pull_request.base.sha }}
        run: node .github/scripts/check-game-addition.mjs "$REQUEST_BRANCH" "$REQUEST_BASE"
